[project]
name = "operations-kpi-automation-demo"
version = "1.0.0"
description = "Synthetic Python, API, Power BI and n8n KPI automation portfolio demo."
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
